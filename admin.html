<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FELX-DARK ADMIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial;text-align:center}
header{padding:30px;background:#111;border-bottom:2px solid red}
h1{color:#ff002b}
.card{background:#171717;border:1px solid #b00020;border-radius:15px;padding:20px;margin:25px auto;max-width:400px}
input,button{width:100%;padding:14px;margin:9px 0;border-radius:8px}
input{background:#222;color:white;border:1px solid #555}
button{background:#d00025;color:white;border:0;font-weight:bold}
#result{color:#00ff80;word-break:break-all}
</style>
</head>
<body>
<header>
<h1>🐺 FELX-DARK</h1>
<p>لوحة إدارة الأكواد</p>
</header>

<div class="card">
<h2>إنشاء كود تفعيل</h2>
<input id="days" type="number" min="1" placeholder="مدة الاشتراك بالأيام">
<button onclick="generateCode()">إنشاء كود</button>
<p id="result"></p>
</div>

<script>
function generateCode(){
 const days=Number(document.getElementById('days').value);
 if(!Number.isInteger(days)||days<1){
  document.getElementById('result').textContent='اكتب مدة صحيحة';
  return;
 }
 const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 let code='FELX-';
 for(let i=0;i<12;i++) code+=chars[Math.floor(Math.random()*chars.length)];
 document.getElementById('result').textContent=code+' — '+days+' يوم';
}
</script>
</body>
</html>
